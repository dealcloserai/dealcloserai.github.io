name: Keep Supabase awake

# Free Supabase projects pause after 7 days without requests.
# This pings DealCloser (and HiredRN, if its secrets are set) every 2 days.
# The heartbeat commit keeps GitHub from disabling the schedule after 60 quiet days.

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase projects
        env:
          DC_URL: ${{ secrets.DEALCLOSER_SUPABASE_URL }}
          DC_KEY: ${{ secrets.DEALCLOSER_SUPABASE_ANON_KEY }}
          HR_URL: ${{ secrets.HIREDRN_SUPABASE_URL }}
          HR_KEY: ${{ secrets.HIREDRN_SUPABASE_ANON_KEY }}
        run: |
          ping() {
            name="$1"; url="${2%/}"; key="$3"
            if [ -z "$url" ] || [ -z "$key" ]; then echo "$name: secrets not set, skipped"; return 0; fi
            a=$(curl -s -o /dev/null -w "%{http_code}" "$url/auth/v1/settings" -H "apikey: $key")
            b=$(curl -s -o /dev/null -w "%{http_code}" "$url/rest/v1/" -H "apikey: $key" -H "Authorization: Bearer $key")
            echo "$name: auth $a, rest $b"
            if [ "$a" -ge 500 ] || [ "$a" = "000" ]; then echo "::error::$name did not answer"; return 1; fi
          }
          status=0
          ping DealCloser "$DC_URL" "$DC_KEY" || status=1
          ping HiredRN "$HR_URL" "$HR_KEY" || status=1
          exit $status

      - name: Record heartbeat
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Keepalive heartbeat" || exit 0
          git push
